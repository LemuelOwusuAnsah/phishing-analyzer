<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing URL Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="scanlines"></div>

  <header>
    <h1><span class="prompt">&gt;_</span> phishing_url_analyzer</h1>
    <p class="subtitle">Heuristic threat analysis // v1.0</p>
  </header>

  <main>
    <section class="input-panel">
      <label for="url">Target URL</label>
      <div class="input-row">
        <input id="url" type="text" placeholder="https://example.com/login" autocomplete="off" spellcheck="false" />
        <button id="analyzeBtn">ANALYZE</button>
      </div>
      <div class="samples">
        <span>Try:</span>
        <button class="sample" data-url="https://www.google.com">google.com</button>
        <button class="sample" data-url="http://paypa1-secure-login.tk/verify">phishy</button>
        <button class="sample" data-url="http://192.168.1.1/account/update">ip host</button>
      </div>
    </section>

    <section id="result" class="result-panel hidden">
      <div class="verdict-row">
        <div class="verdict-badge" id="verdictBadge">—</div>
        <div class="score-wrap">
          <div class="score-label">Risk Score</div>
          <div class="score-value"><span id="scoreValue">0</span><span class="score-max">/100</span></div>
        </div>
      </div>

      <div class="meta-grid">
        <div><span class="meta-k">Hostname</span><span class="meta-v" id="metaHost">—</span></div>
        <div><span class="meta-k">Domain</span><span class="meta-v" id="metaDomain">—</span></div>
        <div><span class="meta-k">Scheme</span><span class="meta-v" id="metaScheme">—</span></div>
        <div><span class="meta-k">Entropy</span><span class="meta-v" id="metaEntropy">—</span></div>
      </div>

      <h2>Findings</h2>
      <ul id="findingsList" class="findings"></ul>
    </section>
  </main>

  <footer>
    <span>Client-side inspection only. No URLs are stored or sent externally.</span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
